<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Comparativo visual — vitrine vs trees.software</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0a0a0a; color: #eee; }
    header { padding: 20px 32px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0a0a0a; z-index: 10; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    h2 { margin: 32px 24px 12px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 24px; }
    figure { margin: 0; background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    figure img { display: block; width: 100%; height: auto; background: white; }
    figcaption { padding: 8px 12px; font-size: 12px; color: #999; border-top: 1px solid #222; }
    a { color: #69b1ff; }
  </style>
</head>
<body>
  <header>
    <h1>Comparativo visual</h1>
    <p style="margin:0;color:#888;font-size:13px">Original: <a href="https://trees.software">https://trees.software</a> · Vitrine: <a href="http://localhost:5173">localhost:5173</a></p>
  </header>

  <h2>1. Elemento Tree (light mode) — lado a lado</h2>
  <div class="row">
    <figure>
      <img src="trees-element.png" alt="trees.software tree" />
      <figcaption>trees.software — <code>&lt;file-tree-container&gt;</code></figcaption>
    </figure>
    <figure>
      <img src="vitrine-element.png" alt="vitrine tree" />
      <figcaption>Vitrine — <code>&lt;file-tree-container&gt;</code> (light)</figcaption>
    </figure>
  </div>

  <h2>2. Elemento Tree (dark mode) — Vitrine</h2>
  <div class="row">
    <figure>
      <img src="vitrine-element-dark.png" alt="vitrine tree dark" />
      <figcaption>Vitrine — <code>&lt;file-tree-container&gt;</code> (dark)</figcaption>
    </figure>
    <figure>
      <img src="vitrine-element.png" alt="vitrine tree light" />
      <figcaption>Vitrine — light (referência)</figcaption>
    </figure>
  </div>

  <h2>3. Páginas completas (light)</h2>
  <div class="row">
    <figure>
      <img src="trees-home.png" alt="trees.software" />
      <figcaption>trees.software home</figcaption>
    </figure>
    <figure>
      <img src="vitrine-home.png" alt="vitrine home" />
      <figcaption>Vitrine — /  (catálogo)</figcaption>
    </figure>
  </div>
</body>
</html>
